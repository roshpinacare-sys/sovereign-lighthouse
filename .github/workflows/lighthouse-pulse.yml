name: lighthouse-pulse
# Sovereign Lighthouse pulse — self-contained, keyless, public data only.
# Replaces the silent T-60 heart-tick writer (last sync 2026-10-10T17:55Z).
# Owner directive 2026-10-11: every folder in regular, living use — fix, never lock.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lighthouse-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Measure live truth (public, keyless)
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request

          NOW = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          degraded = []

          def fetch(url, headers=None, timeout=30):
              req = urllib.request.Request(url)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  degraded.append(url.split("/")[2] + ":" + str(e)[:60])
                  return None, b""

          def rpc(url, api, args):
              body = json.dumps({"jsonrpc": "2.0", "method": "call",
                                 "params": ["condenser_api", api, list(args)], "id": 1}).encode()
              req = urllib.request.Request(url, data=body,
                                           headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.loads(r.read())
                  return d.get("result")
              except Exception as e:
                  degraded.append("rpc:" + str(e)[:60])
                  return None

          def num(x):
              return float(str(x).split()[0])

          pulse = {"at": NOW}

          # refs layer (estate-pseudonym law, wave 19): the roster travels as refs only.
          # Real chain names resolve from FLEET_ROSTER_MAP (repo secret) — nested
          # {refs:{ref:name}} / {names:{name:ref}} / flat shapes accepted. Unresolved =
          # honest degraded pulse: NO name-keyed fleet data written, NEVER a fabricated name.
          ROSTER_MAP = {}
          try:
              _m = json.loads(os.environ.get("FLEET_ROSTER_MAP", "") or "{}")
              if isinstance(_m, dict):
                  for _k, _v in (_m.get("refs") or {}).items():
                      if isinstance(_k, str) and isinstance(_v, str): ROSTER_MAP[_k] = _v
                  for _k, _v in (_m.get("names") or {}).items():
                      if isinstance(_k, str) and isinstance(_v, str): ROSTER_MAP[_v] = _k
                  for _k, _v in _m.items():
                      if isinstance(_k, str) and isinstance(_v, str):
                          if _k.startswith("acct-"): ROSTER_MAP[_k] = _v
                          else: ROSTER_MAP[_v] = _k
          except Exception:
              ROSTER_MAP = {}
          ACC_REFS = ["acct-00", "acct-01", "acct-02", "acct-03", "acct-04", "acct-05",
                      "acct-06", "acct-07", "acct-08", "acct-09", "acct-10",
                      "acct-15", "acct-16", "acct-17", "acct-11", "acct-12", "acct-13"]
          HIVE_REF = "acct-18"
          SOLDIER_REFS = {"acct-11", "acct-12", "acct-13", "acct-15", "acct-16", "acct-17"}
          def ref_of(name):
              return ROSTER_MAP.get(str(name), str(name))

          # 3-c scrub-at-write for VERBATIM upstream text: commit messages mirrored
          # from saos-runtime may quote estate account names in prose (measured leak
          # class: "roster check counts custody ROLES - <name>=master" landed in
          # pulses[].runtimeLatestCommits). Every mirrored string passes through the
          # refs scrub here — boundary-guarded, case-insensitive; unknown words pass.
          def scrub_text(t):
              out = str(t)
              for _name, _ref in ROSTER_MAP.items():
                  out = re.sub(r"(?<![A-Za-z0-9])" + re.escape(_name) + r"(?![A-Za-z0-9])",
                               _ref, out, flags=re.IGNORECASE)
              return out

          # 1. Sandbox heartbeat proof (public raw)
          st, b = fetch("https://raw.githubusercontent.com/roshpinacare-sys/Sandbox/main/ops/AGENT-LEDGER.md")
          if st == 200:
              lines = [l for l in b.decode("utf-8", "replace").strip().splitlines() if l.strip()]
              pulse["sandboxLedgerLastLine"] = lines[-1][:110] if lines else ""
              pulse["sandboxLedgerBytes"] = len(b)
          # 2. saos-runtime latest receipts (authenticated read of public repo)
          tok = os.environ.get("GH_TOKEN", "")
          st, b = fetch("https://api.github.com/repos/roshpinacare-sys/saos-runtime/commits?per_page=5",
                        {"Authorization": "Bearer " + tok, "User-Agent": "lighthouse-pulse"})
          if st == 200:
              cs = json.loads(b)
              pulse["runtimeLatestCommits"] = [
                  {"when": c["commit"]["author"]["date"],
                   "msg": scrub_text(c["commit"]["message"].split("\n")[0][:80])}
                  for c in cs
              ]
          # 3. Steem fleet floors — the living measured truth
          dp = rpc("https://api.steemit.com", "get_dynamic_global_properties", [])
          if dp:
              k = num(dp["total_vesting_fund_steem"]) / num(dp["total_vesting_shares"])
              pulse["steemHead"] = dp.get("head_block_number")
              pulse["steemTime"] = dp.get("time")
              ACCS = [ROSTER_MAP.get(r) for r in ACC_REFS]
              if any(a is None for a in ACCS):
                  degraded.append("fleet-roster:FLEET_ROSTER_MAP-unresolved — fleet floors skipped honestly (refs layer, wave 19; never fabricate)")
                  pulse["rosterResolved"] = False
              else:
                  accs = rpc("https://api.steemit.com", "get_accounts", [ACCS]) or []
                  fleet = {}
                  for a in accs:
                      if not a:
                          continue
                      net = (num(a["vesting_shares"]) + num(a["received_vesting_shares"])
                             - num(a["delegated_vesting_shares"])) * k
                      fleet[ref_of(a["name"])] = round(net, 1)   # scrub-at-write: books are public, refs only
                  pulse["fleetNetSp"] = fleet
                  ops_net = [v for n, v in fleet.items() if n != "acct-00" and n not in SOLDIER_REFS]
                  sol_net = [v for n, v in fleet.items() if n in SOLDIER_REFS and v > 0]
                  pulse["minOperatorSp"] = min(ops_net) if ops_net else None
                  pulse["soldierSp"] = sol_net
                  pulse["treasuryNetSp"] = fleet.get("acct-00")
          # 4. Hive cornerstone (acct-18 ref, decoded via the refs layer)
          HIVE_ACC = ROSTER_MAP.get(HIVE_REF)
          ha = rpc("https://api.hive.blog", "get_accounts", [[HIVE_ACC]]) if HIVE_ACC else None
          if not HIVE_ACC:
              degraded.append("hive-roster:acct-18-unresolved — hive floors skipped honestly (never fabricate)")
              pulse["rosterResolved"] = False
          if ha and ha[0]:
              hdp = rpc("https://api.hive.blog", "get_dynamic_global_properties", [])
              if hdp:
                  hk = num(hdp["total_vesting_fund_hive"]) / num(hdp["total_vesting_shares"])
                  pulse["hiveCornerstoneHp"] = round(num(ha[0]["vesting_shares"]) * hk, 1)
                  pulse["hiveCornerstoneLiquid"] = round(num(ha[0]["balance"]), 1)

          pulse["degraded"] = bool(degraded)
          pulse["degradedWhy"] = degraded[:5]

          # 5. update state.json (preserve all existing keys, incl. REDACTED fields)
          with open("state.json", encoding="utf-8") as f:
              state = json.load(f)
          state["generatedAt"] = NOW
          state["publisher"] = "lighthouse-pulse (GitHub Actions, keyless public truth)"
          prev = state.get("pulses") or []
          prev.insert(0, pulse)
          state["pulses"] = prev[:40]
          state["lastPulse"] = pulse
          with open("state.json", "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=1)

          # 6. grid.json bounded feed
          title = "פעימה-חיה: אוצר {t} SP · מינ-מפעיל {o} SP · חיילים {s} SP · degraded={d}".format(
              t=pulse.get("treasuryNetSp"), o=pulse.get("minOperatorSp"),
              s=(pulse.get("soldierSp") or ["?"]), d=pulse.get("degraded"))
          with open("grid.json", encoding="utf-8") as f:
              grid = json.load(f)
          entries = grid.get("entries") or grid.get("recent") or []
          entries.insert(0, {"id": "pulse-" + NOW.replace(":", "").replace("-", ""),
                             "ts": NOW, "kind": "pulse", "title": title,
                             "sig": ["steem-rpc", "hive-rpc", "sandbox-ledger", "saos-runtime-commits"]})
          if "entries" in grid:
              grid["entries"] = entries[:40]
          else:
              grid["recent"] = entries[:40]
          grid["asof"] = NOW
          grid["pulseCount"] = grid.get("pulseCount", 0) + 1
          with open("grid.json", "w", encoding="utf-8") as f:
              json.dump(grid, f, ensure_ascii=False, indent=1)
          print("PULSE-OK", title)
          PY

      - name: Commit pulse (append-only, retry on race)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add state.json grid.json
          if git diff --cached --quiet; then echo "no-change"; exit 0; fi
          git commit -m "pulse: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3; do
            git push origin main && break
            sleep 6
            git pull --rebase origin main || true
          done
